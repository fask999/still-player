  <div class="ambient-room" aria-hidden="true"><div class="cover-ambient"><div class="cover-backdrop" id="coverBackdropA"></div><div class="cover-backdrop" id="coverBackdropB"></div><div class="cover-backdrop" id="coverBackdropC"></div></div><div class="ambient-orbit"></div><div class="ambient-horizon"></div></div>
  <div class="app-shell">
    <aside class="source-rail" aria-label="音乐来源">
      <div class="rail-brand" aria-label="STILL"><svg class="icon"><use href="#i-still"/></svg><svg class="still-wordmark" viewBox="0 0 164 46" aria-hidden="true"><use href="#i-wordmark"/></svg></div>
      <nav class="source-navigation" aria-label="选择音乐来源">
        <button class="source-item active" id="sourceLocal" data-source="local" aria-label="本地音乐" aria-pressed="true" title="本地音乐"><svg class="icon"><use href="#i-library"/></svg><span>本地</span></button>
        <button class="source-item" id="sourceApple" data-source="apple" aria-label="Apple Music" aria-pressed="false" title="Apple Music"><svg class="icon"><use href="#i-stream"/></svg><span>Apple</span></button>
      </nav>
      <div class="rail-collections" id="railCollections"></div>
      <div class="rail-utilities">
        <button class="rail-tool" id="audioButton" title="音频与设置" aria-label="音频与设置"><svg class="icon"><use href="#i-settings"/></svg></button>
      </div>
      <span class="rail-caption" aria-hidden="true">STILL</span>
    </aside>

    <main class="main" id="mainContent">
      <header class="topbar" id="topbar">
      <div class="brand"><div class="brand-wordmark" aria-label="STILL"><svg class="still-wordmark" viewBox="0 0 164 46" aria-hidden="true"><use href="#i-wordmark"/></svg></div><span class="brand-copy"><strong id="sourceTitle">本地音乐</strong><small id="sourceSubtitle">LOCAL LIBRARY</small></span></div>
      <div class="nav-caption" id="navCaption" hidden>音乐收藏</div>
      <nav class="navigation" id="localNavigation" aria-label="浏览本地音乐">
        <button class="nav-item active" data-view="albums" aria-current="page" title="专辑"><span>唱片</span></button>
        <button class="nav-item" data-view="library" title="曲目库"><span>曲目</span></button>
        <button class="nav-item" data-view="artists" title="艺术家"><svg class="icon"><use href="#i-artist"/></svg><span>艺术家</span></button>
        <button class="nav-item" data-view="playlists" title="播放列表"><svg class="icon"><use href="#i-playlist"/></svg><span>播放列表</span></button>
      </nav>
      <nav class="navigation" id="appleNavigation" aria-label="浏览 Apple Music" hidden>
        <button class="nav-item active" data-apple-view="library" aria-current="page" title="曲目库"><svg class="icon"><use href="#i-library"/></svg><span>曲目库</span></button>
        <button class="nav-item" data-apple-view="albums" title="专辑"><svg class="icon"><use href="#i-album"/></svg><span>专辑</span></button>
        <button class="nav-item" data-apple-view="artists" title="艺术家"><svg class="icon"><use href="#i-artist"/></svg><span>艺术家</span></button>
        <button class="nav-item" data-apple-view="playlists" title="播放列表"><svg class="icon"><use href="#i-playlist"/></svg><span>播放列表</span></button>
      </nav>
        <div class="breadcrumb" hidden><span id="breadcrumbSource">本地音乐</span><span class="crumb-divider">/</span><span id="breadcrumbCurrent">专辑</span></div>
        <div class="top-actions" id="localTopActions">
          <label class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索曲目、专辑、艺术家" aria-label="搜索音乐"></label>
          <button class="icon-button" id="refreshButton" title="刷新音乐库" aria-label="刷新音乐库"><svg class="icon"><use href="#i-refresh"/></svg></button>
        </div>
        <div class="top-actions" id="appleTopActions" hidden>
          <label class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="appleSearch" type="search" maxlength="500" placeholder="搜索 Apple Music" aria-label="搜索 Apple Music" disabled></label>
          <button class="icon-button" id="appleSearchSubmit" title="搜索 Apple Music" aria-label="搜索 Apple Music" disabled><svg class="icon"><use href="#i-search"/></svg></button>
        </div>
      </header>
      <div class="connection-strip" id="connectionStrip"><div class="connection" id="connection" role="status"><span class="status-dot"></span><span id="connectionText">正在启动本地播放内核</span></div><button class="retry-local" id="retryLocal" aria-label="重试本地播放内核" title="重试本地播放内核" hidden><svg class="icon"><use href="#i-refresh"/></svg><span>重试连接</span></button><span class="collection-caption">你的收藏</span></div>
      <section class="content" id="content" tabindex="-1">
        <div class="page-heading">
          <div><p class="eyebrow" id="pageEyebrow">RECORDS</p><h1 id="pageTitle">专辑</h1><p class="page-description" id="pageDescription"></p></div>
          <div class="heading-actions"><button class="button subtle" id="createPlaylist" hidden><svg class="icon"><use href="#i-plus"/></svg>新建列表</button><button class="button quiet" id="importFiles">导入文件</button><button class="button primary" id="importFolder"><svg class="icon"><use href="#i-plus"/></svg>导入文件夹</button></div>
        </div>
        <div class="section-heading"><div><h2 id="sectionTitle">唱片收藏</h2><span class="count" id="itemCount"></span></div><div class="section-tools"><span class="section-hint" id="sectionHint"></span><label class="sort-control" id="sortControl">排序 <select id="sortSelect" aria-label="排序方式"><option value="order">原始顺序</option><option value="title">标题</option><option value="artist">艺术家</option><option value="album">专辑</option><option value="duration">时长</option></select></label></div></div>
        <p id="libraryState" class="library-status" role="status" hidden></p><span id="localResultStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
        <div id="viewContent"></div>
      </section>
      <section class="content apple-content" id="appleContent" tabindex="-1" hidden>
        <div class="page-heading apple-heading"><div><p class="eyebrow">APPLE MUSIC</p><h1 id="applePageTitle">曲目库</h1><p class="page-description" id="applePageDescription">你的 Apple Music 订阅曲库。</p></div></div>
        <div class="source-state" id="appleStateCard">
          <div class="source-emblem"><svg class="icon"><use href="#i-stream"/></svg></div>
          <div class="source-state-copy"><p class="eyebrow">APPLE MUSIC</p><h2 id="appleStateTitle">正在读取连接状态</h2><p id="appleStateMessage">请稍候。</p><p class="source-prerequisite" id="ciderPrerequisite" hidden>请先安装并打开正版 Cider、完成登录，再在 Cider 中批准配对。连接会请求播放、队列、曲库和音频权限。</p><div class="source-capabilities" id="appleCapabilities"></div><div class="credential-meta" id="appleCredentialInfo"></div><div class="apple-actions"><button class="button primary" id="appleConfigure" disabled hidden>配置开发者凭据</button><button class="button subtle" id="appleAuthorize" disabled hidden>登录 Apple Music</button><button class="button subtle" id="appleRefresh"><svg class="icon"><use href="#i-refresh"/></svg>刷新状态</button><button class="button subtle" id="appleBackCollection" hidden>返回曲库</button></div><p class="source-optional-note" id="appleDeveloperNote" hidden>开发者计划可能收费，请在 Apple 官网确认。没有凭据时可以暂时跳过。</p></div>
        </div>
        <div id="appleCollection" hidden><div class="section-heading"><div><h2 id="appleSectionTitle">全部曲目</h2><span class="count" id="appleItemCount"></span></div><div class="section-tools"><button class="text-button" id="appleShowStatus">连接状态</button><button class="text-button" id="appleCollectionRefresh">刷新曲库</button></div></div><span id="appleResultStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span><div id="appleViewContent"></div></div>
      </section>
      <section class="immersive" id="immersive" hidden aria-label="歌词和正在播放">
        <div class="immersive-top"><button class="listening-search" id="listeningSearch"><svg class="icon"><use href="#i-search"/></svg><span>搜索音乐</span></button><button class="text-button with-icon" id="leaveImmersive"><svg class="icon"><use href="#i-back"/></svg>返回音乐库</button></div>
        <div class="immersive-body">
          <div class="immersive-art"><div class="listening-sculpture" id="listeningDeck" aria-label="正在播放的封面与可播放曲目"><div class="sleeve-neighbors" id="sleeveNeighbors"></div><div class="current-sleeve"><div class="large-cover" id="largeCover"></div><h2 id="immersiveTitle">没有正在播放的音乐</h2></div><div class="listening-orbit" aria-hidden="true"></div></div><div class="playing-kicker" id="listeningState" hidden>尚未播放</div><p id="immersiveArtist" hidden></p><span id="listeningContext" class="listening-context" hidden></span><span id="lyricsFixture" class="fixture-badge" hidden></span><div id="lyricsSource" class="lyrics-source" hidden></div></div>
          <div class="listening-cabin"><div class="cabin-tabs" aria-label="听音侧栏"><button id="cabinLyrics" class="cabin-tab active" aria-pressed="true"><svg class="icon"><use href="#i-lyrics"/></svg>歌词</button><button id="cabinQueue" class="cabin-tab" aria-pressed="false"><svg class="icon"><use href="#i-queue"/></svg>当前播放列表</button></div><div class="lyrics-column" id="lyricsColumn"><span id="lyricsStatus" hidden>歌词</span><div class="lyrics-scroll" id="lyricsScroll" tabindex="0" aria-label="歌词"><div id="lyricsBody"></div></div><button class="follow-button" id="resumeFollow" hidden>回到当前句<svg class="icon"><use href="#i-down"/></svg></button></div><span id="contextResultStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span><div id="cabinQueueBody" class="cabin-queue-body" hidden></div></div>
        </div>
      </section>
    </main>

    <footer class="player" id="playerFooter" aria-label="播放控制">
      <div class="now-playing">
        <button class="mini-cover" id="miniCover" aria-label="打开歌词" title="打开歌词"></button>
        <div class="now-copy"><span id="nowSource" class="now-source">尚无播放来源</span><button id="nowTitle" class="now-title" disabled>没有正在播放的音乐</button><span id="nowArtist" class="now-artist">选择一首曲目开始聆听</span><span id="nowFixture" class="fixture-badge" hidden></span></div>
      </div>
      <div class="player-center" id="playerCenter"><div class="transport" id="transport">
        <div class="transport-buttons"><button class="transport-small" id="previous" aria-label="上一曲" title="上一曲" disabled><svg class="icon"><use href="#i-previous"/></svg></button><button class="play-button" id="toggle" aria-label="播放" title="播放" disabled><svg class="icon"><use id="toggleIcon" href="#i-play"/></svg></button><button class="transport-small" id="next" aria-label="下一曲" title="下一曲" disabled><svg class="icon"><use href="#i-next"/></svg></button></div>
        <div class="progress"><span id="elapsed">0:00</span><div class="wave-seek" id="waveSeek"><div class="silver-wave footer-wave" id="footerWave" aria-hidden="true"></div><div class="silver-wave footer-wave wave-played" id="footerWavePlayed" aria-hidden="true"></div><input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="播放进度" disabled></div><span id="duration">0:00</span></div>
      </div>
      </div>
      <div class="player-extras">
        <div class="playback-order"><svg class="icon" aria-hidden="true"><use href="#i-order"/></svg><select id="playbackOrder" aria-label="播放顺序" title="播放顺序" disabled><option>播放顺序</option></select></div>
        <svg class="icon volume-icon" aria-hidden="true"><use href="#i-volume"/></svg><input id="volume" type="range" min="0" max="1" step="0.01" value="0" aria-label="音量" disabled>
      </div>
    </footer>
  </div>
  <div id="settingsControlsHome" hidden><div id="settingsPlaybackControls"><div class="settings-shortcuts"><button class="button" id="lyricsTools">歌词设置</button><button class="button" id="findLyrics">搜索歌词</button><button class="button" id="importLyrics">导入歌词</button><button class="button" id="queueButton">临时队列</button></div></div></div>
  <dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><div><span class="dialog-kicker">STILL</span><h2 id="dialogTitle"></h2></div><button class="icon-button" id="closeDialog" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></div><p class="dialog-alert" id="dialogAlert" role="alert" hidden></p><div class="dialog-body" id="dialogBody"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
