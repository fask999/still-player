name: Publish exact accepted public candidate

on:
  push:
    branches: ['release-recovery/v1.1.0']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref == 'refs/heads/release-recovery/v1.1.0' && 'refs/tags/v1.1.0' || github.ref }}
  cancel-in-progress: false

jobs:
  verify-promotion:
    if: github.repository == 'fask999/still-player' && github.event_name == 'push' && github.actor == 'fask999' && github.triggering_actor == 'fask999'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      tag_object_sha: ${{ steps.verify.outputs.tag_object_sha }}
      tag_commit_sha: ${{ steps.verify.outputs.tag_commit_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check out original tagged source for recovery verification
        if: github.ref == 'refs/heads/release-recovery/v1.1.0'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/v1.1.0
          path: tools/release-recovery-source
          persist-credentials: false
          fetch-depth: 1
      - name: Bootstrap exact reviewed verifier Node
        shell: pwsh
        run: ./scripts/prepare-release-tools-node.ps1
      - name: Verify tag, exact successful attempt, immutable artifact and closed bytes
        id: verify
        shell: pwsh
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          & $env:STILL_RELEASE_NODE scripts/release-public-api.js verify
          exit $LASTEXITCODE
  publish:
    needs: verify-promotion
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check out original tagged source for recovery verification
        if: github.ref == 'refs/heads/release-recovery/v1.1.0'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/v1.1.0
          path: tools/release-recovery-source
          persist-credentials: false
          fetch-depth: 1
      - name: Bootstrap exact reviewed verifier Node
        shell: pwsh
        run: ./scripts/prepare-release-tools-node.ps1
      - name: Reverify exact bytes, create own draft, upload five assets, rehash remotely, publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STILL_VERIFIED_TAG_OBJECT: ${{ needs.verify-promotion.outputs.tag_object_sha }}
          STILL_VERIFIED_TAG_COMMIT: ${{ needs.verify-promotion.outputs.tag_commit_sha }}
        run: |
          & $env:STILL_RELEASE_NODE scripts/release-public-api.js publish
          exit $LASTEXITCODE
