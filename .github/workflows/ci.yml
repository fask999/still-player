name: Canonical temp path proof
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-temp-proof:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Observe actual TEMP paths and isolated fixture A/B
        run: node .github/diagnostics/canonical-temp.cjs
